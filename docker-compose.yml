version: "3.9"

# ============================================================
# SmartCharge EV Charging Platform — Docker Compose
# ============================================================

networks:
  smartcharge-network:
    driver: bridge

volumes:
  user-db-data:
  station-db-data:
  booking-db-data:
  session-db-data:
  payment-db-data:
  redis-data:
  prometheus-data:
  grafana-data:

services:

  # ──────────────────────────────────────────
  # Zookeeper (Kafka dependency)
  # ──────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: smartcharge-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - smartcharge-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ──────────────────────────────────────────
  # Kafka
  # ──────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: smartcharge-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    networks:
      - smartcharge-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ──────────────────────────────────────────
  # Redis
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: smartcharge-redis
    restart: unless-stopped
    command: redis-server --save 20 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - smartcharge-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ──────────────────────────────────────────
  # Databases
  # ──────────────────────────────────────────
  user-db:
    image: postgres:16-alpine
    container_name: smartcharge-user-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: user_db
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - smartcharge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d user_db"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  station-db:
    image: postgis/postgis:16-3.4
    container_name: smartcharge-station-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: station_db
    ports:
      - "5434:5432"
    volumes:
      - station-db-data:/var/lib/postgresql/data
    networks:
      - smartcharge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d station_db"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  booking-db:
    image: postgres:16-alpine
    container_name: smartcharge-booking-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: booking_db
    ports:
      - "5435:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    networks:
      - smartcharge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d booking_db"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  session-db:
    image: postgres:16-alpine
    container_name: smartcharge-session-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: session_db
    ports:
      - "5436:5432"
    volumes:
      - session-db-data:/var/lib/postgresql/data
    networks:
      - smartcharge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d session_db"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  payment-db:
    image: postgres:16-alpine
    container_name: smartcharge-payment-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: payment_db
    ports:
      - "5437:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    networks:
      - smartcharge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d payment_db"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ──────────────────────────────────────────
  # Infrastructure Services
  # ──────────────────────────────────────────
  eureka-server:
    build:
      context: ./infrastructure/eureka-server
      dockerfile: Dockerfile
    container_name: smartcharge-eureka
    restart: unless-stopped
    env_file: .env
    ports:
      - "8761:8761"
    networks:
      - smartcharge-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  api-gateway:
    build:
      context: ./infrastructure/api-gateway
      dockerfile: Dockerfile
    container_name: smartcharge-gateway
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - smartcharge-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ──────────────────────────────────────────
  # Microservices
  # ──────────────────────────────────────────
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: smartcharge-user-service
    restart: unless-stopped
    env_file: .env
    ports:
      - "8081:8081"
    depends_on:
      user-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - smartcharge-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  station-service:
    build:
      context: ./services/station-service
      dockerfile: Dockerfile
    container_name: smartcharge-station-service
    restart: unless-stopped
    env_file: .env
    ports:
      - "8082:8082"
    depends_on:
      station-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - smartcharge-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  booking-service:
    build:
      context: ./services/booking-service
      dockerfile: Dockerfile
    container_name: smartcharge-booking-service
    restart: unless-stopped
    env_file: .env
    ports:
      - "8083:8083"
    depends_on:
      booking-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartcharge-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  charging-session-service:
    build:
      context: ./services/charging-session-service
      dockerfile: Dockerfile
    container_name: smartcharge-session-service
    restart: unless-stopped
    env_file: .env
    ports:
      - "8084:8084"
    depends_on:
      session-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartcharge-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: smartcharge-payment-service
    restart: unless-stopped
    env_file: .env
    ports:
      - "8085:8085"
    depends_on:
      payment-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - smartcharge-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: smartcharge-notification-service
    restart: unless-stopped
    env_file: .env
    ports:
      - "8086:8086"
    depends_on:
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - smartcharge-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  energy-optimization-service:
    build:
      context: ./services/energy-optimization-service
      dockerfile: Dockerfile
    container_name: smartcharge-energy-service
    restart: unless-stopped
    env_file: .env
    ports:
      - "8087:8087"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartcharge-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8087/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ──────────────────────────────────────────
  # Frontend
  # ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartcharge-frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - smartcharge-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ──────────────────────────────────────────
  # Monitoring
  # ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: smartcharge-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - smartcharge-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  grafana:
    image: grafana/grafana:latest
    container_name: smartcharge-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - smartcharge-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
