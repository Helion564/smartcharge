# ============================================================
# Prometheus Configuration — SmartCharge Platform
# ============================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: smartcharge
    environment: production

# Alertmanager config (placeholder for future alerting rules)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Load alerting rules once and re-evaluate at the specified interval
rule_files: []
  # - "first_rules.yml"
  # - "second_rules.yml"

# ──────────────────────────────────────────
# Scrape Configurations
# ──────────────────────────────────────────
scrape_configs:

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ── Infrastructure ──────────────────────
  - job_name: eureka-server
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ["eureka-server:8761"]
        labels:
          service: eureka-server
          tier: infrastructure

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ["api-gateway:8080"]
        labels:
          service: api-gateway
          tier: infrastructure

  # ── Microservices ────────────────────────
  - job_name: user-service
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ["user-service:8081"]
        labels:
          service: user-service
          tier: application

  - job_name: station-service
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ["station-service:8082"]
        labels:
          service: station-service
          tier: application

  - job_name: booking-service
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ["booking-service:8083"]
        labels:
          service: booking-service
          tier: application

  - job_name: charging-session-service
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ["charging-session-service:8084"]
        labels:
          service: charging-session-service
          tier: application

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ["payment-service:8085"]
        labels:
          service: payment-service
          tier: application

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ["notification-service:8086"]
        labels:
          service: notification-service
          tier: application

  - job_name: energy-optimization-service
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ["energy-optimization-service:8087"]
        labels:
          service: energy-optimization-service
          tier: application
